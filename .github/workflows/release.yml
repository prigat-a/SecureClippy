name: Release

# Every change to the app on main publishes a new ready-to-run download.
# The landing page always links to the latest one:
#   https://github.com/<owner>/<repo>/releases/latest/download/SecureClipboard.zip
on:
  push:
    branches: [main]
    paths:
      - "SecureClipboard/**"
      - "Package.swift"
      - "build-app.sh"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish (Apple Silicon)
    runs-on: macos-15 # arm64 runner
    timeout-minutes: 20
    env:
      VERSION: 1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v7

      - name: Set version
        run: |
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $VERSION" SecureClipboard/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${{ github.run_number }}" SecureClipboard/Info.plist

      - name: Build app
        run: |
          ./build-app.sh
          lipo -archs "Secure Clipboard.app/Contents/MacOS/SecureClipboard" | grep -qx arm64
          codesign --verify --verbose "Secure Clipboard.app"

      - name: Zip app
        # ditto keeps the code signature and permissions intact.
        run: ditto -c -k --sequesterRsrc --keepParent "Secure Clipboard.app" SecureClipboard.zip

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$VERSION" SecureClipboard.zip \
            --title "Secure Clipboard $VERSION" \
            --target "$GITHUB_SHA" \
            --latest \
            --notes "Built automatically from $GITHUB_SHA for Apple Silicon Macs (macOS 12+).

          **Download:** SecureClipboard.zip below. Unzip it, move *Secure Clipboard* to Applications, and see the [install guide](https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/#install) for opening it the first time.

          Not notarized by Apple and not professionally audited. Use at your own risk."
